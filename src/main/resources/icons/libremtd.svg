<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256"
     xmlns="http://www.w3.org/2000/svg">
    <rect width="256" height="256" rx="46" fill="#00703c"/>
    <!-- vertical post and horizontal base -->
    <line x1="64"  y1="208" x2="192" y2="208" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="128" y1="208" x2="128" y2="96"  stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <!-- beam -->
    <line x1="80"  y1="116" x2="176" y2="116" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <!-- pivot -->
    <circle cx="128" cy="116" r="10" fill="#ffffff"/>
    <!-- left chain -->
    <line x1="96"  y1="116" x2="96"  y2="160" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <!-- left pan (arc) -->
    <path d="M72 164 Q96 178 120 164" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <!-- right chain (shorter, pan higher) -->
    <line x1="160" y1="116" x2="160" y2="144" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <!-- right pan (arc) -->
    <path d="M136 148 Q160 162 184 148" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
</svg>